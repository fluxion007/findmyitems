name: Bug report
description: Report behavior that differs from the documentation
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        The mod works only in single-player worlds. It intentionally disables itself on multiplayer servers, so that is not a bug. See the README section "Single-player only".
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe what the mod did and what you expected.
      placeholder: The catalog listed 64 iron ingots in a barrel, but retrieving them had no effect.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from a new world where possible. If the problem occurs in only one world, describe what is different.
      placeholder: |
        1. Place a double chest and put 40 diamonds in its right half
        2. Open and close it
        3. Press B, search for "diamond"
        4. Click the hopper button
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Find My Items version
      placeholder: "VERSION"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Minecraft, Fabric Loader, and Fabric API versions
      placeholder: "Minecraft 26.2, Fabric Loader 0.19.3, Fabric API API_VERSION"
    validations:
      required: true
  - type: textarea
    id: other-mods
    attributes:
      label: Other installed mods
      description: List all mods if the list is short. Otherwise, list rendering and inventory mods, which most often interact with this mod.
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Include relevant lines from logs/latest.log, including any stack trace. This field is automatically formatted as code.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: This occurred in a single-player world
          required: true
        - label: I searched existing issues for the same problem
          required: true
