plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.0'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url "https://api.modrinth.com/maven" }
}

loom {
    splitEnvironmentSourceSets()

    accessWidenerPath = file("src/main/resources/findmyitems.accesswidener")

    mods {
        "findmyitems" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "findmyitems-test"
        enableGameTests = true
        enableClientGameTests = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation "maven.modrinth:sodium:${project.sodium_version}"
    implementation "maven.modrinth:modmenu:${project.modmenu_version}"

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// The /fmitest testbed exists to stock a dev world by hand. It is already registered only when
// isDevelopmentEnvironment() is true, so a player could never run it — but shipping the class at
// all invites someone to find it and wonder. It is loaded lazily inside that check, so a released
// jar without it behaves identically.
jar {
    exclude 'dev/smpb/findmyitems/debug/**'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// The release notes Modrinth shows are the ones in CHANGELOG.md: the section for the version
// being published, from its `## VERSION` heading to the next one. A version with no section is
// a version whose changes were never written down, so the release stops rather than ship blank
// notes.
def changelogSection = { String version ->
    def match = (file('CHANGELOG.md').text =~ /(?ms)^## \Q${version}\E\b.*?\n(.*?)(?=^## |\z)/)
    if (!match) {
        throw new GradleException("CHANGELOG.md has no '## ${version}' section")
    }
    match[0][1].trim()
}

publishMods {
    // This Loom has no remapJar task — the mod is built against Mojang mappings, so `jar` is
    // already the jar that ships.
    file = tasks.jar.archiveFile
    changelog = providers.provider { changelogSection(project.version.toString()) }
    type = STABLE
    modLoaders.add("fabric")

    // `./gradlew publishMods -PdryRun` prints what would be uploaded and uploads nothing.
    // Run it before a real release.
    dryRun = providers.gradleProperty("dryRun").present

    modrinth {
        projectId = "mPTBl3Fj"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(project.minecraft_version)
        // These mirror `depends` and `recommends` in fabric.mod.json. If that file changes,
        // change these too, or Modrinth will offer a download the loader then refuses to run.
        requires("fabric-api", "modmenu")
        optional("sodium", "shulkerboxtooltip")
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
